log_config:
  name: app
  log_level: INFO
  to_console: true
  console_format: json
  console_stream: stdout
  file_output: false
  json_format: false
  redaction_enabled: true
  max_message_length: 16384
  max_exception_length: 32768
  capture_sqlalchemy: false
  sqlalchemy_level: WARNING
  redact_fields:
    - password
    - passwd
    - token
    - access_token
    - refresh_token
    - authorization
    - cookie
    - secret
    - api_key
