log_config:
  name: utils_logs
  log_folder: utils_logs
  log_level: DEBUG
  to_console: true
  console_format: colored  # 生产容器建议改为 json
  console_stream: stdout
  file_output: true        # 多 worker/容器建议设为 false
  json_format: true        # 是否额外写入 JSONL 文件
  rotation_mode: time      # time: 按时间；size: 按大小
  rotation_when: midnight
  rotation_interval: 1
  max_bytes: 52428800      # size 模式下单文件 50 MiB
  backup_count: 30
  redaction_enabled: true
  max_message_length: 16384
  max_exception_length: 32768
  capture_sqlalchemy: false
  sqlalchemy_level: WARNING
  redact_fields:
    - password
    - passwd
    - token
    - access_token
    - refresh_token
    - authorization
    - cookie
    - secret
    - api_key
