[project]
name = "logger-project"
version = "0.2.0"
description = "FastAPI-friendly structured logging with request trace IDs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "coloredlogs>=15.0.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
watch = ["watchdog>=6.0.0"]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "logger_utils"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
